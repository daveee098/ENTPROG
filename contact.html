<!-- Contact Section -->
<section class="container py-5">

    <div class="text-center mb-5">

        <h1 class="display-4 fw-bold">
            Contact Me
        </h1>

        <p class="lead text-muted">
            Feel free to get in touch with me.
        </p>

    </div>

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h3 class="text-center mb-4">
                        My Contact Information
                    </h3>

                    <!-- Email -->
                    <div class="mb-3">
                        <h5>Email</h5>
                        <a href="mailto:davematthewasuncion13@gmail.com">
                            davematthewasuncion13@gmail.com
                        </a>
                    </div>

                    <!-- Phone -->
                    <div class="mb-3">
                        <h5>Phone</h5>
                        <a href="tel:0976459812">
                            0976459812
                        </a>
                    </div>

                    <!-- LinkedIn -->
                    <div class="mb-4">
                        <h5>LinkedIn</h5>
                        <a href="https://www.linkedin.com/in/dave-matthew-asuncion-7b4891435/"
                           target="_blank"
                           class="btn btn-primary">
                            Visit My LinkedIn
                        </a>
                    </div>

                    <hr>

                    <!-- Message Form -->
                    <h3 class="text-center mb-4">
                        Send Me a Message
                    </h3>

                    <form>

                        <div class="mb-3">

                            <label for="name" class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   placeholder="Enter your name">

                        </div>

                        <div class="mb-3">

                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   placeholder="Enter your email">

                        </div>

                        <div class="mb-3">

                            <label for="message" class="form-label">
                                Message
                            </label>

                            <textarea class="form-control"
                                      id="message"
                                      rows="5"
                                      placeholder="Enter your message"></textarea>

                        </div>

                        <button type="submit"
                                class="btn btn-primary">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>
